[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video2post"
version = "0.1.0"
description = "Turn technical videos into editable Chinese post drafts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "typer>=0.12",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.0",
]

asr-chinese = [
  "funasr>=1.1",
]

dev = [
  "pytest>=8.0",
]

[project.scripts]
video2post = "video2post.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["video2post*"]
