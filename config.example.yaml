app:
  output_dir: outputs
  keep_audio: true
  skip_existing: true
  cleanup_source: false

download:
  preferred_audio_format: wav
  cookies_file:
  # Useful for YouTube links that require a logged-in browser session.
  # Example: chrome or safari
  cookies_from_browser:
  # Useful for YouTube EJS / challenge solving. Node is a practical default.
  js_runtimes: node
  # Optional but useful when YouTube requires the EJS remote challenge solver.
  remote_components:

audio:
  sample_rate: 16000
  channels: 1

asr:
  default_language: auto
  english_provider: faster_whisper
  # For Apple Silicon experiments you can switch to: mlx_whisper
  chinese_provider: funasr
  faster_whisper_model: base
  mlx_whisper_model: mlx-community/whisper-tiny
  funasr_model: paraformer

llm:
  provider: openai_compatible
  base_url:
  model:
  temperature: 0.7
  max_tokens: 4096
  request_timeout_seconds: 300
  retry_attempts: 2

generation:
  default_targets:
    - translation
    - notes
    - x_article
    - x_thread
    - x_titles
    - article
    - script
    - titles
  # Transcripts longer than this value are summarized chunk by chunk before final generation.
  chunk_max_chars: 6000
